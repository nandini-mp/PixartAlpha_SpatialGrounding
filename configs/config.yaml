# Central configuration. All paths are relative to the project root.
seed: 42

paths:
  data_dir: data
  download_dir: data/download
  coco_dir: data/coco
  processed_dir: data/processed
  splits_dir: data/splits
  checkpoints_dir: checkpoints
  outputs_dir: outputs

data:
  coco_year: 2017
  annotations_url: http://images.cocodataset.org/annotations/annotations_trainval2017.zip
  num_samples: 25000
  split: {train: 20000, val: 2500, test: 2500}
  min_objects: 2
  max_objects: 6
  min_box_area_frac: 0.01
  skip_crowd: true

relations:
  margin: 0.02
  near_dist: 0.25
  far_dist: 0.60
  overlap_iou: 0.05
  inside_frac: 0.90
  max_relations_per_image: 6
  p_connected: 0.5
  extra_edge_prob: 0.3
  secondary_prob: 0.25
  between_prob: 0.15
  between_perp_tol: 0.25

loss:
  lambda_l1: 1.0
  lambda_giou: 1.0
  lambda_rel: 0.2
  rel_margin: 0.02

model:
  gnn_layers: 3
  hidden_dim: 256
  heads: 4
  text_encoder: openai/clip-vit-base-patch32

train:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 128
  epochs: 40
  grad_clip: 1.0
  amp: true

parser:
  model_name: t5-small
  max_source_len: 256
  max_target_len: 256
  lr: 0.0005
  batch_size: 64
  epochs: 10

prompts:
  size_small_area: 0.05
  size_large_area: 0.25
  style_weights: {sentences: 0.4, comma: 0.4, semicolon: 0.2}
  variants_per_image: {train: 1, val: 1, test: 1}

parser_train:
  bf16: true
  warmup_ratio: 0.05
  weight_decay: 0.01
  grad_clip: 1.0
  eval_batch_size: 128
  num_beams_val: 1
  num_beams_final: 4
  select_metric: struct_exact

layout_loss:
  w_l1: 1.0
  w_giou: 1.0
  w_rel: 0.5
  margin: 0.02
  near_dist: 0.35
  far_dist: 0.5
  inside_slack: 0.03
  overlap_margin: 0.0

layout_train:
  seed: 0
  batch_size: 128
  epochs: 40
  lr: 0.0005
  weight_decay: 0.0001
  warmup_steps: 200
  grad_clip: 1.0
  tf_start: 0.5
  tf_end: 0.0
  tf_decay_epochs: 15
  patience: 12
  amp: false
  hidden: 256
  heads: 4
  layers: 3
  rel_dim: 64
  mlp_hidden: 256
  dropout: 0.0
