# Central configuration. All paths are relative to the project root.
seed: 42

paths:
  data_dir: data
  download_dir: data/download
  coco_dir: data/coco
  processed_dir: data/processed
  splits_dir: data/splits
  checkpoints_dir: checkpoints
  outputs_dir: outputs

data:
  coco_year: 2017
  num_samples: 25000
  split: {train: 20000, val: 2500, test: 2500}
  min_objects: 2
  max_objects: 6
  min_box_area_frac: 0.01
  skip_crowd: true

relations:
  margin: 0.02
  near_dist: 0.25
  far_dist: 0.60
  overlap_iou: 0.05
  inside_frac: 0.90
  max_relations_per_image: 6

loss:
  lambda_l1: 1.0
  lambda_giou: 1.0
  lambda_rel: 0.2
  rel_margin: 0.02

model:
  gnn_layers: 3
  hidden_dim: 256
  heads: 4
  text_encoder: openai/clip-vit-base-patch32

train:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 128
  epochs: 40
  grad_clip: 1.0
  amp: true

parser:
  model_name: t5-small
  max_source_len: 128
  max_target_len: 128
  lr: 0.0005
  batch_size: 64
  epochs: 10
